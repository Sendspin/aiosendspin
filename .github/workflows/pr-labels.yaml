---
name: PR Labels

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main

jobs:
  pr_labels:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: 🏷 Verify PR has a valid label
        uses: ludeeus/action-require-labels@2.0.0
        with:
          labels: >-
            breaking-change, bugfix, new-feature, enhancement, refactor, documentation, maintenance, ci, dependencies
